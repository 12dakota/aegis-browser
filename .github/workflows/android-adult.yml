name: Build Adult (Aegis Open)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-adult:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true
      - run: chmod +x ./gradlew
      - name: Assemble adultDebug
        id: build
        run: ./gradlew assembleAdultDebug --stacktrace --no-daemon
      - name: Stage APK as aegis-adult-debug.apk
        run: |
          mkdir -p release-assets
          SRC=$(find app/build/outputs/apk/adult -name "*.apk" | head -1)
          echo "Source: $SRC"
          cp "$SRC" release-assets/aegis-adult-debug.apk
          ls -la release-assets/
      - uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: aegis-adult-debug
          path: release-assets/aegis-adult-debug.apk
          retention-days: 3
          if-no-files-found: warn
      - name: Publish adult-debug to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adult-${{ github.run_number }}
          name: Aegis Open (adult-debug) #${{ github.run_number }}
          body: |
            ## Aegis Open — adult dual-engine browser

            **Asset:** `aegis-adult-debug.apk` (select this for the adult build)

            - Package id: `com.aegis.browser.adult`
            - No parental login
            - Extensions unrestricted by default
            - Engines: Chromium WebView + GeckoView
            - Commit: `${{ github.sha }}`

            Install alongside the Family APK if desired (different applicationId).
          files: release-assets/aegis-adult-debug.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
