name: Build Family (Aegis)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-family:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true
      - run: chmod +x ./gradlew
      - name: Assemble familyDebug
        id: build
        run: ./gradlew assembleFamilyDebug --stacktrace --no-daemon
      - name: Stage APK as aegis-family-debug.apk
        run: |
          mkdir -p release-assets
          SRC=$(find app/build/outputs/apk/family -name "*.apk" | head -1)
          echo "Source: $SRC"
          cp "$SRC" release-assets/aegis-family-debug.apk
          ls -la release-assets/
      - uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: aegis-family-debug
          path: release-assets/aegis-family-debug.apk
          retention-days: 3
          if-no-files-found: warn
      - name: Publish family-debug to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: family-${{ github.run_number }}
          name: Aegis Family (family-debug) #${{ github.run_number }}
          body: |
            ## Aegis Browser — family / parental build

            **Asset:** `aegis-family-debug.apk`

            - Package id: `com.aegis.browser`
            - Mandatory login + cloud policy
            - Dual engine + extension controls
            - Commit: `${{ github.sha }}`
          files: release-assets/aegis-family-debug.apk
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
