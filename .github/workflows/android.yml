name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Placeholder google-services.json (if missing)
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            cat > app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "aegis-browser-placeholder",
              "storage_bucket": "aegis-browser-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.aegis.browser" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyPlaceholderKeyReplaceWithRealFirebase" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
            echo "Using placeholder google-services.json"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK (all packages / GeckoView enabled)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: find app/build/outputs -name "*.apk" -ls

      - name: Upload APK artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Publish APK to GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aegis Browser debug build #${{ github.run_number }}
          body: |
            Debug APK from commit ${{ github.sha }}
            Dual-engine (Chromium WebView + GeckoView) with Cloudflare Gateway PAC.
            Placeholder google-services.json — replace with real Firebase for production auth.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
