name: Android CI (legacy combined)

# Prefer android-family.yml and android-adult.yml.
# This still builds both flavors for convenience.
on:
  workflow_dispatch:

jobs:
  build-both:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses || true
          chmod +x ./gradlew
          ./gradlew assembleFamilyDebug assembleAdultDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-both-flavors
          path: |
            app/build/outputs/apk/family/debug/*.apk
            app/build/outputs/apk/adult/debug/*.apk
          retention-days: 5
